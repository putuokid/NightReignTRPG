<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NightReign TRPG</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .user-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      margin-bottom: 12px;

      font-size: 18px;
      text-align: left;

      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;

      cursor: pointer;
    }

    .user-button:hover {
      background: #eee;
    }

    .admin {
      margin-top: 30px;
    }

    .admin-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .error {
      color: red;
    }
  </style>
</head>


<body>

  <h1>NightReign TRPG</h1>

  <div class="subtitle">
    ユーザーを選択してください
  </div>

  <div id="users">
    読み込み中...
  </div>


  <script>

    // ==========================================
    // Supabase設定
    // ==========================================

    const SUPABASE_URL =
      "ここにProject URL";

    const SUPABASE_KEY =
      "ここにPublishable key";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // ユーザー一覧取得
    // ==========================================

    async function loadUsers() {

      const usersArea =
        document.getElementById("users");


      const {
        data,
        error
      } =
        await supabaseClient
          .from("m_user")
          .select("*")
          .eq("delete_flg", false)
          .order("id");


      if (error) {

        console.error(error);

        usersArea.innerHTML =
          `<p class="error">
            ユーザー情報の取得に失敗しました
          </p>`;

        return;
      }


      const normalUsers =
        data.filter(user => !user.is_admin);

      const adminUsers =
        data.filter(user => user.is_admin);


      let html = "";


      // 一般ユーザー
      normalUsers.forEach(user => {

        html += `
          <button
            class="user-button"
            onclick="selectUser(
              ${user.id},
              '${escapeText(user.user_name)}',
              false
            )"
          >
            ${escapeText(user.user_name)}
          </button>
        `;
      });


      // 管理者
      if (adminUsers.length > 0) {

        html += `
          <div class="admin">

            <div class="admin-label">
              管理者
            </div>
        `;


        adminUsers.forEach(user => {

          html += `
            <button
              class="user-button"
              onclick="selectUser(
                ${user.id},
                '${escapeText(user.user_name)}',
                true
              )"
            >
              ${escapeText(user.user_name)}
            </button>
          `;
        });


        html += `
          </div>
        `;
      }


      usersArea.innerHTML = html;
    }


    // ==========================================
    // ユーザー選択
    // ==========================================

    function selectUser(
      userId,
      userName,
      isAdmin
    ) {

      localStorage.setItem(
        "user_id",
        userId
      );

      localStorage.setItem(
        "user_name",
        userName
      );

      localStorage.setItem(
        "is_admin",
        isAdmin
      );


      // セッション選択画面へ
      window.location.href =
        "session.html";
    }


    // ==========================================
    // HTML表示用
    // ==========================================

    function escapeText(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text ?? "";

      return div.innerHTML;
    }


    // ==========================================
    // 初期処理
    // ==========================================

    loadUsers();

  </script>

</body>

</html>
