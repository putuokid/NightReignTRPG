<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>キャラクター選択 | NightReign TRPG</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    .session-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .user-info {
      color: #666;
      margin-bottom: 30px;
    }

    .back-link {
      margin-left: 10px;
      color: #555;
      cursor: pointer;
      text-decoration: underline;
    }

    .character-card {
      background: white;

      border: 1px solid #ccc;
      border-radius: 8px;

      padding: 16px;
      margin-bottom: 12px;
    }

    .character-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .player-name {
      color: #666;
      margin-bottom: 12px;
    }

    .basic-status {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }

    .detail-button {
      width: 100%;

      padding: 12px;

      font-size: 16px;
      font-weight: bold;

      border: 1px solid #aaa;
      border-radius: 6px;

      background: #f8f8f8;

      cursor: pointer;
    }

    .detail-button:hover {
      background: #eee;
    }

    .create-area {
      margin-top: 40px;
      padding-top: 20px;

      border-top: 1px solid #ccc;
    }

    .create-button {
      width: 100%;

      padding: 16px;

      font-size: 18px;
      font-weight: bold;

      border: none;
      border-radius: 8px;

      cursor: pointer;
    }

    .empty {
      color: #777;
    }

    .error {
      color: red;
    }

    .my-character {
      font-size: 12px;

      display: inline-block;

      padding: 3px 7px;
      margin-left: 8px;

      border: 1px solid #aaa;
      border-radius: 4px;

      vertical-align: middle;
    }

  </style>

</head>


<body>

  <h1>キャラクター選択</h1>


  <div
    id="sessionName"
    class="session-name"
  >
  </div>


  <div class="user-info">

    <span id="userName"></span>
    で利用中

    <span
      class="back-link"
      onclick="backToSessions()"
    >
      セッション選択へ戻る
    </span>

  </div>


  <div id="characters">

    読み込み中...

  </div>


  <div class="create-area">

    <button
      class="create-button"
      onclick="createCharacter()"
    >
      ＋ 新規キャラクター作成
    </button>

  </div>


  <script>

    // ==========================================
    // Supabase設定
    // ==========================================

    const SUPABASE_URL =
      "https://jxturqgabremmiyczrus.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_F7Yqj7rt8rhY1TdcppNi3w_kgYqA1gU";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // localStorage取得
    // ==========================================

    const userId =
      localStorage.getItem("user_id");

    const userName =
      localStorage.getItem("user_name");

    const sessionId =
      localStorage.getItem("session_id");

    const sessionName =
      localStorage.getItem("session_name");


    // ==========================================
    // 必要情報チェック
    // ==========================================

    if (!userId) {

      // ユーザー未選択
      window.location.href =
        "index.html";

    } else if (!sessionId) {

      // セッション未選択
      window.location.href =
        "session.html";

    } else {

      document
        .getElementById("userName")
        .textContent =
          userName ?? "";

      document
        .getElementById("sessionName")
        .textContent =
          sessionName ?? "";

    }


    // ==========================================
    // キャラクター一覧取得
    // ==========================================

    async function loadCharacters() {

      const charactersArea =
        document.getElementById(
          "characters"
        );


      const {
        data,
        error
      } =
        await supabaseClient
          .from("t_character")
          .select("*")
          .eq(
            "session_id",
            sessionId
          )
          .eq(
            "delete_flg",
            false
          )
          .order(
            "id",
            { ascending: true }
          );


      if (error) {

        console.error(
          "キャラクター取得エラー",
          error
        );

        charactersArea.innerHTML =
          `
            <p class="error">
              キャラクター情報の取得に失敗しました
            </p>
          `;

        return;
      }


      // ========================================
      // キャラクター0件
      // ========================================

      if (!data || data.length === 0) {

        charactersArea.innerHTML =
          `
            <p class="empty">
              このセッションには
              まだキャラクターが登録されていません。
            </p>
          `;

        return;
      }


      // ========================================
      // キャラクターカード作成
      // ========================================

      let html = "";


      data.forEach(character => {

        const isMyCharacter =
          String(character.user_id) ===
          String(userId);


        html += `

          <div class="character-card">

            <div class="character-name">

              ${escapeHtml(
                character.name
              )}

              ${
                isMyCharacter
                  ? `
                    <span class="my-character">
                      自分のキャラ
                    </span>
                  `
                  : ""
              }

            </div>


            <div class="player-name">

              PL：
              ${escapeHtml(
                character.player_name ?? "-"
              )}

            </div>


            <div class="basic-status">

              <div>
                HP：
                ${character.hp ?? "-"}
              </div>

              <div>
                FP：
                ${character.fp ?? "-"}
              </div>

              <div>
                加護：
                ${character.bless ?? "-"}
              </div>

            </div>


            <button
              class="detail-button"
              onclick="openCharacter(
                ${character.id}
              )"
            >
              詳細を見る
            </button>

          </div>

        `;
      });


      charactersArea.innerHTML =
        html;
    }


    // ==========================================
    // キャラクター詳細
    // ==========================================

    function openCharacter(
      characterId
    ) {

      localStorage.setItem(
        "character_id",
        characterId
      );


      window.location.href =
        "character.html";
    }


    // ==========================================
    // 新規キャラクター作成
    // ==========================================

    function createCharacter() {

      // 前回選択したキャラクターIDが
      // 残っていた場合は削除
      localStorage.removeItem(
        "character_id"
      );


      window.location.href =
        "character-create.html";
    }


    // ==========================================
    // セッション選択へ戻る
    // ==========================================

    function backToSessions() {

      localStorage.removeItem(
        "session_id"
      );

      localStorage.removeItem(
        "session_name"
      );

      localStorage.removeItem(
        "character_id"
      );


      window.location.href =
        "session.html";
    }


    // ==========================================
    // HTMLエスケープ
    // ==========================================

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text ?? "";

      return div.innerHTML;
    }


    // ==========================================
    // 初期処理
    // ==========================================

    loadCharacters();

  </script>

</body>

</html>
